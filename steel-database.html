<style>
  .app-header {
    background: linear-gradient(135deg, var(--surface) 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--border);
    padding: 24px 32px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .back-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
    font-size: 18px;
    text-decoration: none;
  }

  .back-btn:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .brand-icon {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--accent), #cc5500);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    box-shadow: 0 0 20px rgba(255,107,0,0.15);
  }

  .brand h1 {
    font-family: var(--font-display);
    font-size: 26px;
    letter-spacing: 2px;
    color: #fff;
  }

  .brand h1 span { color: var(--accent); }

  .brand p {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .search-box {
    position: relative;
    width: 320px;
  }

  .search-box input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px 10px 38px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    outline: none;
    transition: all 0.2s;
  }

  .search-box input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255,107,0,0.15);
  }

  .search-box input::placeholder { color: var(--subtle); }

  .search-icon {
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--subtle);
    font-size: 14px;
  }

  .stats-bar {
    display: flex;
    gap: 24px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .stat {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
  }

  .stat-value {
    font-family: var(--font-mono);
    font-weight: 600;
    color: var(--accent);
    font-size: 13px;
  }

  .std-bar {
    display: flex;
    gap: 10px;
    padding: 16px 32px 4px;
    background: var(--bg);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .std-bar::-webkit-scrollbar { display: none; }
  .std-tile {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    min-width: 130px;
    padding: 10px 16px;
    border-radius: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--font-body);
    white-space: nowrap;
  }
  .std-tile:hover { border-color: var(--accent); transform: translateY(-1px); }
  .std-tile.active {
    border-color: var(--accent);
    background: linear-gradient(135deg, rgba(255,107,0,0.14), rgba(255,107,0,0.04));
    box-shadow: 0 2px 10px rgba(255,107,0,0.12);
  }
  .std-tile .std-label {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.3px;
  }
  .std-tile.active .std-label { color: var(--accent); }
  .std-tile .std-sub {
    font-size: 10px;
    color: var(--muted);
    font-family: var(--font-mono);
  }

  .tab-bar {
    display: flex;
    gap: 4px;
    padding: 12px 32px 0;
    background: var(--bg);
    overflow-x: auto;
    scrollbar-width: none;
    border-bottom: 1px solid var(--border);
  }

  .tab-bar::-webkit-scrollbar { display: none; }

  .tab {
    padding: 10px 18px;
    border-radius: 8px 8px 0 0;
    background: transparent;
    border: 1px solid transparent;
    border-bottom: none;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
    font-family: var(--font-body);
  }

  .tab:hover {
    color: var(--text);
    background: var(--card);
  }

  .tab.active {
    background: var(--card);
    color: var(--accent);
    border-color: var(--border);
    font-weight: 600;
  }

  .tab .tab-count {
    font-family: var(--font-mono);
    font-size: 10px;
    background: var(--border);
    color: var(--muted);
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 6px;
  }

  .tab.active .tab-count {
    background: rgba(255,107,0,0.15);
    color: var(--accent);
  }

  .main-content {
    padding: 0 32px 32px;
  }

  .table-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 0;
    flex-wrap: wrap;
    gap: 8px;
  }

  .table-info-left {
    font-size: 13px;
    color: var(--muted);
  }

  .table-info-left strong {
    color: var(--text);
    font-weight: 600;
  }

  .table-wrapper {
    overflow-x: auto;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    scrollbar-width: thin;
    scrollbar-color: var(--subtle) transparent;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  thead {
  }

  thead tr:first-child th {
    background: #1a1a1a;
    color: var(--text);
    font-weight: 600;
    padding: 11px 14px;
    text-align: center;
    white-space: nowrap;
    border-bottom: none;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s, color 0.15s;
    font-size: 12px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }

  thead tr:first-child th:hover {
    background: #242424;
    color: var(--accent);
  }

  th.sorted {
    color: var(--accent) !important;
    background: #1e1a14 !important;
  }

  thead tr:first-child th:first-child {
    text-align: left;
    padding-left: 18px;
    position: sticky;
    left: 0;
    z-index: 11;
    background: #1a1a1a;
  }

  thead tr:nth-child(2) th {
    background: #141414;
    color: #666;
    font-weight: 400;
    font-size: 11px;
    padding: 5px 14px;
    text-align: center;
    border-bottom: 2px solid var(--accent);
    font-family: var(--font-mono);
    cursor: default;
    user-select: none;
  }

  thead tr:nth-child(2) th:first-child {
    text-align: left;
    padding-left: 18px;
    position: sticky;
    left: 0;
    z-index: 11;
    background: #141414;
  }

  .sort-arrow {
    display: inline-block;
    margin-left: 4px;
    font-size: 10px;
    opacity: 0.4;
  }

  th.sorted .sort-arrow { opacity: 1; color: var(--accent); }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }

  tbody tr:hover {
    background: rgba(255,107,0,0.04);
  }

  tbody tr:nth-child(even) {
    background: rgba(14, 14, 14, 0.3);
  }

  tbody tr:nth-child(even):hover {
    background: rgba(255,107,0,0.04);
  }

  td {
    padding: 10px 14px;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }

  td:first-child {
    text-align: left;
    padding-left: 18px;
    font-weight: 600;
    color: #fff;
    font-family: var(--font-body);
    font-size: 13px;
    position: sticky;
    left: 0;
    background: inherit;
    z-index: 5;
  }

  tbody tr:nth-child(odd) td:first-child { background: var(--card); }
  tbody tr:nth-child(even) td:first-child { background: #1a1a1a; }
  tbody tr:hover td:first-child { background: rgba(30, 30, 30, 0.98); }

  .no-results {
    text-align: center;
    padding: 60px 20px;
    color: var(--subtle);
  }

  .no-results-icon {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.3;
  }

  .footer {
    text-align: center;
    padding: 24px;
    color: var(--subtle);
    font-size: 12px;
    border-top: 1px solid var(--border);
  }

  .footer a { color: var(--accent); text-decoration: none; }

  @media (max-width: 768px) {
    .app-header { padding: 16px; }
    .tab-bar { padding: 8px 16px 0; }
    .std-bar { padding: 12px 16px 4px; }

    .main-content { padding: 0 16px 16px; }
    .search-box { width: 100%; }
    .brand h1 { font-size: 20px; }
  }

    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  tbody tr {
    animation: fadeIn 0.15s ease-out both;
  }
</style>

function formatNum(v) {
  if (v === null || v === undefined || v === '') return '—';
  if (typeof v === 'string') return v;
  if (Math.abs(v) >= 10000) return v.toLocaleString('en-GB');
  return v.toString();
}

// Standard tiles (origin/spec groupings) sit above the family tabs.
const STANDARDS = [
  { id: 'UK',  label: 'UK',        sub: 'BS EN 10365 · BS 4-1' },
  { id: 'EN',  label: 'European',  sub: 'IPE · HE (BS EN 10365)' },
  { id: 'US',  label: 'American',  sub: 'ASTM W · HP' },
  { id: 'ALU', label: 'Aluminium', sub: 'EN 755-2 (ref)' },
  { id: 'SS',  label: 'Stainless', sub: 'EN 10088/10219 (ref)' }
];
const STANDARD_LABEL = Object.fromEntries(STANDARDS.map(x => [x.id, x.label]));

let activeStandard = 'UK';
let activeName = SECTION_NAMES.find(n => (DATA[n].standard || 'UK') === activeStandard) || SECTION_NAMES[0];
let searchTerm = '';
let sortCol = -1;
let sortDir = 1;

// Families visible under the current standard tile.
function visibleNames() {
  return SECTION_NAMES.filter(n => (DATA[n].standard || 'UK') === activeStandard);
}

function getTotalSections() {
  return SECTION_NAMES.reduce((s, k) => s + DATA[k].rows.length, 0);
}

function getFilteredRows() {
  const section = DATA[activeName];
  let rows = section.rows;
  if (searchTerm) {
    const q = searchTerm.toLowerCase();
    rows = rows.filter(r => r[0].toLowerCase().includes(q) || r.some((c, i) => i > 0 && String(c).includes(q)));
  }
  if (sortCol >= 0) {
    rows = [...rows].sort((a, b) => {
      const va = a[sortCol], vb = b[sortCol];
      if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * sortDir;
      return String(va).localeCompare(String(vb)) * sortDir;
    });
  }
  return rows;
}

    <nav class="tab-bar">
      ${names.map(name => `
        <button class="tab ${name === activeName ? 'active' : ''}" data-name="${name.replace(/"/g,'&quot;')}">
          ${name}<span class="tab-count">${DATA[name].rows.length}</span>
        </button>
      `).join('')}
    </nav>
    <main class="main-content">
      <div class="table-info">
        <div class="table-info-left">
          <strong>${activeName}</strong> — ${rows.length} section${rows.length !== 1 ? 's' : ''}
          ${searchTerm ? ` matching "${searchTerm}"` : ''}
        </div>
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              ${section.headers.map((h, i) => `
                <th class="${sortCol === i ? 'sorted' : ''}" data-col="${i}">
                  ${h}<span class="sort-arrow">${sortCol === i ? (sortDir === 1 ? '▲' : '▼') : '⇅'}</span>
                </th>
              `).join('')}
            </tr>
            <tr>
              ${section.units.map((u, i) => `<th>${u}</th>`).join('')}
            </tr>
          </thead>
          <tbody>
            ${rows.length ? rows.map((row, ri) => `
              <tr style="animation-delay:${Math.min(ri * 8, 400)}ms">
                ${row.map((cell, ci) => `<td>${ci === 0 ? cell : formatNum(cell)}</td>`).join('')}
              </tr>
            `).join('') : `
              <tr><td colspan="${section.headers.length}" class="no-results">
                <div class="no-results-icon">🔍</div>
                <div>No sections matching "${searchTerm}"</div>
                <div style="margin-top:8px;font-size:13px">Try a different search term</div>
              </td></tr>
            `}
          </tbody>
        </table>
      </div>
    </main>
    <footer class="footer">
      BAMA Fabrication · Steel Sections Database · UK (BS EN 10365 / BS 4-1) · EN (IPE/HE) · US (ASTM W/HP) · Aluminium & Stainless (reference) · Source: British Steel 2026, SCI Blue Book, Tata Steel
    </footer>
  `;

  // Bind events
  document.getElementById('search').addEventListener('input', e => {
    searchTerm = e.target.value;
    sortCol = -1;
    render();
    document.getElementById('search').focus();
    const input = document.getElementById('search');
    input.setSelectionRange(input.value.length, input.value.length);
  });

  document.querySelectorAll('.std-tile').forEach(btn => {
    btn.addEventListener('click', () => {
      activeStandard = btn.dataset.std;
      const names = visibleNames();
      activeName = names[0];
      sortCol = -1;
      render();
    });
  });

  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      activeName = btn.dataset.name;
      sortCol = -1;
      render();
    });
  });

  document.querySelectorAll('thead tr:first-child th').forEach(th => {
    th.addEventListener('click', () => {
      const col = parseInt(th.dataset.col);
      if (sortCol === col) sortDir *= -1;
      else { sortCol = col; sortDir = 1; }
      render();
    });
  });
}

render();

</script>
</body>
</html>
